name: Release builds (macOS & Linux)

# Triggered when the Windows build is published locally with scripts/release.ps1.
# Builds the macOS .dmg (arm64 + x64) and Linux .deb + binary (x64 + arm64/Raspberry Pi), attaches them to the
# same release, then deletes every older release, tag and workflow run: only the latest exists.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: release
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, name: macOS arm64 }
          - { os: macos-15-intel, name: macOS x64 }
          - { os: ubuntu-22.04, name: Linux x64 }
          - { os: ubuntu-22.04-arm, name: Linux arm64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Linux native window support (GTK/WebKit)
        if: runner.os == 'Linux'
        continue-on-error: true   # without it the app falls back to the default browser
        run: |
          sudo apt-get update
          sudo apt-get install -y libgirepository1.0-dev libcairo2-dev pkg-config gir1.2-webkit2-4.1 gir1.2-gtk-3.0 gir1.2-ayatanaappindicator3-0.1
          pip install "PyGObject<3.51" pycairo

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Tests
        run: python -m pytest -q

      - name: Build
        run: python scripts/build.py

      - name: Attach to release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG="${{ github.event.release.tag_name }}"
          if [ -z "$TAG" ]; then TAG=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName -q .tagName); fi
          gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"

  cleanup:
    name: Keep only the latest version
    needs: build
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Delete older releases and their tags
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          LATEST=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName -q .tagName)
          gh release list --repo "$GITHUB_REPOSITORY" --limit 200 --json tagName -q '.[].tagName' | while read -r t; do
            [ "$t" != "$LATEST" ] && gh release delete "$t" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes || true
          done
          gh api "repos/$GITHUB_REPOSITORY/tags" --paginate -q '.[].name' | while read -r t; do
            [ "$t" != "$LATEST" ] && gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/$t" || true
          done

      - name: Delete previous workflow runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run list --repo "$GITHUB_REPOSITORY" --limit 500 --json databaseId,status \
            -q ".[] | select(.databaseId != ${{ github.run_id }} and .status == \"completed\") | .databaseId" \
            | while read -r id; do gh run delete "$id" --repo "$GITHUB_REPOSITORY" || true; done
